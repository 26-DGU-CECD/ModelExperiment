# Experiment queue (v2 labels). python src/run_queue.py --queue configs/queue.yaml  |  --status for progress.
# gpu steps: at most 2 concurrent. done marker = results/<name>/metrics.json unless `done:` given.
steps:
  - {name: E0m_v2, gpu: true, post: train, depends_on: [],
     cmd: "{PY} -u -W ignore src/train.py --config configs/E0m_v2.yaml"}
  - {name: E2k_v2, gpu: true, post: train, depends_on: [E0m_v2],
     cmd: "{PY} -u -W ignore src/train.py --config configs/E2k_v2.yaml"}
  - {name: E1k_v2, gpu: true, post: train, depends_on: [E0m_v2],
     cmd: "{PY} -u -W ignore src/train.py --config configs/E1k_v2.yaml"}
  - {name: E1_v2, gpu: false, post: train, depends_on: [],
     cmd: "{PY} -u -W ignore src/train.py --config configs/E1_v2.yaml"}

  # generalist fusions (members = v2 generalists)
  - {name: F_best_single, gpu: false, post: fusion, depends_on: [E0m_v2, E1k_v2, E2k_v2],
     cmd: "{PY} -u -W ignore src/fuse.py --name F_best_single --method best_single --exps E0m_v2 E1k_v2 E2k_v2"}
  - {name: F_generalist_hard, gpu: false, post: fusion, depends_on: [E0m_v2, E1k_v2, E2k_v2],
     cmd: "{PY} -u -W ignore src/fuse.py --name F_generalist_hard --method hard_vote --exps E0m_v2 E1k_v2 E2k_v2"}
  - {name: F_generalist_soft, gpu: false, post: fusion, depends_on: [E0m_v2, E1k_v2, E2k_v2],
     cmd: "{PY} -u -W ignore src/fuse.py --name F_generalist_soft --method soft_avg --exps E0m_v2 E1k_v2 E2k_v2"}
  - {name: F_generalist_weighted, gpu: false, post: fusion, depends_on: [E0m_v2, E1k_v2, E2k_v2],
     cmd: "{PY} -u -W ignore src/fuse.py --name F_generalist_weighted --method weighted_soft --exps E0m_v2 E1k_v2 E2k_v2"}
  - {name: F_generalist_stacking, gpu: false, post: fusion, depends_on: [E0m_v2, E1k_v2, E2k_v2],
     cmd: "{PY} -u -W ignore src/fuse.py --name F_generalist_stacking --method stacking --exps E0m_v2 E1k_v2 E2k_v2"}
  - {name: F_generalist_stacking_mlp, gpu: false, post: fusion, depends_on: [E0m_v2, E1k_v2, E2k_v2],
     cmd: "{PY} -u -W ignore src/fuse.py --name F_generalist_stacking_mlp --method stacking_mlp --exps E0m_v2 E1k_v2 E2k_v2"}

  # semantic specialists
  - {name: S1_efficientat_caution, gpu: true, post: train, depends_on: [E2k_v2, E1k_v2],
     cmd: "{PY} -u -W ignore src/train.py --config configs/S1_efficientat_caution.yaml"}
  - {name: S2_yamnet_emergency, gpu: true, post: train, depends_on: [E2k_v2, E1k_v2],
     cmd: "{PY} -u -W ignore src/train.py --config configs/S2_yamnet_emergency.yaml"}
  - {name: S3_mnv4_daily, gpu: true, post: train, depends_on: [S1_efficientat_caution, S2_yamnet_emergency],
     cmd: "{PY} -u -W ignore src/train.py --config configs/S3_mnv4_daily.yaml"}

  # best assignment -> SB specialists (only where best != semantic)
  - {name: assign_best, gpu: false, post: fusion, depends_on: [E0m_v2, E1k_v2, E2k_v2], done: results/assign_best_v2.done,
     cmd: "{PY} -u src/assign_best.py --exps E0m_v2 E1k_v2 E2k_v2 && {PY} -u src/make_sb_configs.py && echo E0m_v2 E1k_v2 E2k_v2 > results/assign_best_v2.done"}
  - {name: SB_efficientat_best, gpu: true, post: train, optional: true, config: configs/SB_efficientat_best.yaml, depends_on: [assign_best, S3_mnv4_daily],
     cmd: "{PY} -u -W ignore src/train.py --config configs/SB_efficientat_best.yaml"}
  - {name: SB_yamnet_best, gpu: true, post: train, optional: true, config: configs/SB_yamnet_best.yaml, depends_on: [assign_best, S3_mnv4_daily],
     cmd: "{PY} -u -W ignore src/train.py --config configs/SB_yamnet_best.yaml"}
  - {name: SB_mnv4_best, gpu: true, post: train, optional: true, config: configs/SB_mnv4_best.yaml, depends_on: [assign_best, SB_efficientat_best, SB_yamnet_best],
     cmd: "{PY} -u -W ignore src/train.py --config configs/SB_mnv4_best.yaml"}

  # specialist fusions
  - {name: F_semantic_rule, gpu: false, post: fusion, depends_on: [S1_efficientat_caution, S2_yamnet_emergency, S3_mnv4_daily],
     cmd: "{PY} -u -W ignore src/fuse.py --name F_semantic_rule --method rule --exps S1_efficientat_caution S2_yamnet_emergency S3_mnv4_daily"}
  - {name: F_semantic_gated, gpu: false, post: fusion, depends_on: [S1_efficientat_caution, S2_yamnet_emergency, S3_mnv4_daily],
     cmd: "{PY} -u -W ignore src/fuse.py --name F_semantic_gated --method gated --exps S1_efficientat_caution S2_yamnet_emergency S3_mnv4_daily"}
  - {name: F_semantic_stacked, gpu: false, post: fusion, depends_on: [S1_efficientat_caution, S2_yamnet_emergency, S3_mnv4_daily],
     cmd: "{PY} -u -W ignore src/fuse.py --name F_semantic_stacked --method stacked --exps S1_efficientat_caution S2_yamnet_emergency S3_mnv4_daily"}
  - {name: oracle_semantic, gpu: false, post: fusion, depends_on: [S1_efficientat_caution, S2_yamnet_emergency, S3_mnv4_daily],
     cmd: "{PY} -u -W ignore src/fuse.py --name oracle_semantic --method oracle --exps S1_efficientat_caution S2_yamnet_emergency S3_mnv4_daily"}
  - {name: F_best_fusions, gpu: false, post: fusion, depends_on: [SB_efficientat_best, SB_yamnet_best, SB_mnv4_best], done: results/F_best_fusions.done,
     cmd: "{PY} -u -W ignore src/fuse_best.py"}

  # ablations
  - {name: A1_efficientat_scratch, gpu: true, post: train, depends_on: [S3_mnv4_daily],
     cmd: "{PY} -u -W ignore src/train.py --config configs/A1_efficientat_scratch.yaml"}
  - {name: make_random_groups, gpu: false, post: none, depends_on: [], done: configs/random_groups.done,
     cmd: "{PY} -u src/make_random_groups.py && echo done > configs/random_groups.done"}
  - {name: A2_efficientat_random, gpu: true, post: train, depends_on: [make_random_groups, A1_efficientat_scratch],
     cmd: "{PY} -u -W ignore src/train.py --config configs/A2_efficientat_random.yaml"}
  - {name: A2_yamnet_random, gpu: true, post: train, depends_on: [make_random_groups, A1_efficientat_scratch],
     cmd: "{PY} -u -W ignore src/train.py --config configs/A2_yamnet_random.yaml"}
  - {name: A2_mnv4_random, gpu: true, post: train, depends_on: [A2_efficientat_random, A2_yamnet_random],
     cmd: "{PY} -u -W ignore src/train.py --config configs/A2_mnv4_random.yaml"}
  - {name: F_random_gated, gpu: false, post: fusion, depends_on: [A2_efficientat_random, A2_yamnet_random, A2_mnv4_random],
     cmd: "{PY} -u -W ignore src/fuse.py --name F_random_gated --method gated --exps A2_efficientat_random A2_yamnet_random A2_mnv4_random"}

  # ---- homogeneous ensembles (same backbone family) ----
  # (a) seeds
  - {name: G_mn10_seed1, gpu: true, post: train, depends_on: [F_random_gated],
     cmd: "{PY} -u -W ignore src/train.py --config configs/G_mn10_seed1.yaml"}
  - {name: G_mn10_seed2, gpu: true, post: train, depends_on: [F_random_gated],
     cmd: "{PY} -u -W ignore src/train.py --config configs/G_mn10_seed2.yaml"}
  - {name: F_seed_soft, gpu: false, post: fusion, depends_on: [E0m_v2, G_mn10_seed1, G_mn10_seed2],
     cmd: "{PY} -u -W ignore src/fuse.py --name F_seed_soft --method soft_avg --exps E0m_v2 G_mn10_seed1 G_mn10_seed2"}
  - {name: F_seed_stacking, gpu: false, post: fusion, depends_on: [E0m_v2, G_mn10_seed1, G_mn10_seed2],
     cmd: "{PY} -u -W ignore src/fuse.py --name F_seed_stacking --method stacking --exps E0m_v2 G_mn10_seed1 G_mn10_seed2"}
  - {name: overlap_seed, gpu: false, post: fusion, depends_on: [E0m_v2, G_mn10_seed1, G_mn10_seed2],
     cmd: "{PY} -u -W ignore src/error_overlap.py --name overlap_seed --exps E0m_v2 G_mn10_seed1 G_mn10_seed2"}
  # (b) mn10 specialists on the semantic groups, routed by E0m_v2
  - {name: S_mn10_caution, gpu: true, post: train, depends_on: [G_mn10_seed1, G_mn10_seed2],
     cmd: "{PY} -u -W ignore src/train.py --config configs/S_mn10_caution.yaml"}
  - {name: S_mn10_emergency, gpu: true, post: train, depends_on: [G_mn10_seed1, G_mn10_seed2],
     cmd: "{PY} -u -W ignore src/train.py --config configs/S_mn10_emergency.yaml"}
  - {name: S_mn10_daily, gpu: true, post: train, depends_on: [S_mn10_caution, S_mn10_emergency],
     cmd: "{PY} -u -W ignore src/train.py --config configs/S_mn10_daily.yaml"}
  - {name: F_mn10_gated, gpu: false, post: fusion, depends_on: [S_mn10_caution, S_mn10_emergency, S_mn10_daily],
     cmd: "{PY} -u -W ignore src/fuse.py --name F_mn10_gated --method gated --exps S_mn10_caution S_mn10_emergency S_mn10_daily"}
  - {name: F_mn10_stacked, gpu: false, post: fusion, depends_on: [S_mn10_caution, S_mn10_emergency, S_mn10_daily],
     cmd: "{PY} -u -W ignore src/fuse.py --name F_mn10_stacked --method stacked --exps S_mn10_caution S_mn10_emergency S_mn10_daily"}
  - {name: F_mn10_hier, gpu: false, post: fusion, depends_on: [S_mn10_caution, S_mn10_emergency, S_mn10_daily, E0m_v2],
     cmd: "{PY} -u -W ignore src/fuse.py --name F_mn10_hier --method hier --router E0m_v2 --exps S_mn10_caution S_mn10_emergency S_mn10_daily"}
  - {name: oracle_mn10, gpu: false, post: fusion, depends_on: [S_mn10_caution, S_mn10_emergency, S_mn10_daily],
     cmd: "{PY} -u -W ignore src/fuse.py --name oracle_mn10 --method oracle --exps S_mn10_caution S_mn10_emergency S_mn10_daily"}
  # (c) EfficientAT variants
  - {name: G_dymn10, gpu: true, post: train, depends_on: [S_mn10_daily],
     cmd: "{PY} -u -W ignore src/train.py --config configs/G_dymn10.yaml"}
  - {name: G_mn04, gpu: true, post: train, depends_on: [S_mn10_daily],
     cmd: "{PY} -u -W ignore src/train.py --config configs/G_mn04.yaml"}
  # equal-MACs specialist set: mn04 x3 (~= mn10 x1), warm start from G_mn04, routed by E0m_v2 for hier
  - {name: H_mn04_caution, gpu: true, post: train, depends_on: [G_mn04],
     cmd: "{PY} -u -W ignore src/train.py --config configs/H_mn04_caution.yaml"}
  - {name: H_mn04_emergency, gpu: true, post: train, depends_on: [G_mn04],
     cmd: "{PY} -u -W ignore src/train.py --config configs/H_mn04_emergency.yaml"}
  - {name: H_mn04_daily, gpu: true, post: train, depends_on: [H_mn04_caution, H_mn04_emergency],
     cmd: "{PY} -u -W ignore src/train.py --config configs/H_mn04_daily.yaml"}
  - {name: F_mn04_gated, gpu: false, post: fusion, depends_on: [H_mn04_caution, H_mn04_emergency, H_mn04_daily],
     cmd: "{PY} -u -W ignore src/fuse.py --name F_mn04_gated --method gated --exps H_mn04_caution H_mn04_emergency H_mn04_daily"}
  - {name: F_mn04_stacked, gpu: false, post: fusion, depends_on: [H_mn04_caution, H_mn04_emergency, H_mn04_daily],
     cmd: "{PY} -u -W ignore src/fuse.py --name F_mn04_stacked --method stacked --exps H_mn04_caution H_mn04_emergency H_mn04_daily"}
  - {name: F_mn04_hier, gpu: false, post: fusion, depends_on: [H_mn04_caution, H_mn04_emergency, H_mn04_daily, E0m_v2],
     cmd: "{PY} -u -W ignore src/fuse.py --name F_mn04_hier --method hier --router E0m_v2 --exps H_mn04_caution H_mn04_emergency H_mn04_daily"}
  - {name: oracle_mn04, gpu: false, post: fusion, depends_on: [H_mn04_caution, H_mn04_emergency, H_mn04_daily],
     cmd: "{PY} -u -W ignore src/fuse.py --name oracle_mn04 --method oracle --exps H_mn04_caution H_mn04_emergency H_mn04_daily"}
  - {name: F_effat_variants_soft, gpu: false, post: fusion, depends_on: [E0m_v2, G_dymn10, G_mn04],
     cmd: "{PY} -u -W ignore src/fuse.py --name F_effat_variants_soft --method soft_avg --exps E0m_v2 G_dymn10 G_mn04"}
  - {name: F_effat_variants_stacking, gpu: false, post: fusion, depends_on: [E0m_v2, G_dymn10, G_mn04],
     cmd: "{PY} -u -W ignore src/fuse.py --name F_effat_variants_stacking --method stacking --exps E0m_v2 G_dymn10 G_mn04"}
  - {name: overlap_effat, gpu: false, post: fusion, depends_on: [E0m_v2, G_dymn10, G_mn04],
     cmd: "{PY} -u -W ignore src/error_overlap.py --name overlap_effat --exps E0m_v2 G_dymn10 G_mn04"}
  - {name: overlap_hetero, gpu: false, post: fusion, depends_on: [E0m_v2, E1k_v2, E2k_v2],
     cmd: "{PY} -u -W ignore src/error_overlap.py --name overlap_hetero --exps E0m_v2 E1k_v2 E2k_v2"}
  - {name: overlap_all, gpu: false, post: fusion, depends_on: [E0m_v2, E1k_v2, E2k_v2, G_mn10_seed1, G_mn10_seed2, G_dymn10, G_mn04],
     cmd: "{PY} -u -W ignore src/error_overlap.py --name overlap_all --exps E0m_v2 E1k_v2 E2k_v2 G_mn10_seed1 G_mn10_seed2 G_dymn10 G_mn04"}

  # ---- cascades (no training) and final operating-point recomputation ----
  - {name: F_cascade_E2k, gpu: false, post: fusion, depends_on: [E0m_v2, E2k_v2],
     cmd: "{PY} -u -W ignore src/cascade.py --name F_cascade_E2k --gate E2k_v2 --cls E0m_v2"}
  - {name: F_cascade_E0m, gpu: false, post: fusion, depends_on: [E0m_v2],
     cmd: "{PY} -u -W ignore src/cascade.py --name F_cascade_E0m --gate E0m_v2 --cls E0m_v2"}
  - {name: reopoint_all, gpu: false, post: fusion, done: results/reopoint_all.done,
     depends_on: [F_generalist_stacking, F_semantic_stacked, oracle_semantic, F_best_fusions, F_random_gated, E1_v2,
                  F_seed_stacking, F_mn10_hier, oracle_mn10, F_effat_variants_stacking, overlap_seed, overlap_effat, overlap_hetero, overlap_all,
                  F_generalist_stacking_mlp, F_mn04_hier, oracle_mn04, F_cascade_E2k, F_cascade_E0m],
     cmd: "{PY} -u -W ignore src/reopoint.py && {PY} -I src/make_leaderboard.py && echo done > results/reopoint_all.done"}

  - {name: final_summary, gpu: false, post: fusion, done: results/final_summary_v2.done,
     depends_on: [reopoint_all],
     cmd: "{PY} -u src/results_summary.py && echo done > results/final_summary_v2.done"}
