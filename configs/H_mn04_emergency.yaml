# equal-MACs specialist set: mn04_as x3 ~= mn10 x1. recipe v2 (warm start from G_mn04).
exp_name: H_mn04_emergency
model: efficientat
mode: specialist
group_model: yamnet
group_set: semantic
epochs: 20
lr: 2.0e-05
weight_decay: 0.0001
batch_size: 64
warmup_epochs: 0
label_smoothing: 0.1
amp: true
seed: 42
patience: 8
num_workers: 2
sampler:
  balanced: true
  cap: 3000
aug:
  mixup_p: 0.3
  mixup_alpha: 0.2
  gain_db: 6.0
  freqm: 48
  timem: 192
  musan: true
  musan_prob: 0.5
  musan_snr_range:
  - 5
  - 20
model_args:
  pretrained_name: mn04_as
  head_type: mlp
init_from: checkpoints/G_mn04/best.pt
head_lr: 0.001
other_label_smoothing: 0.2
other_ratio: null
recipe: ft-v2
