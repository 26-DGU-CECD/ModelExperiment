# YAMNet PyTorch port (torch_audioset), full fine-tune with KD from E0 (efficientat generalist). 0.5 CE + 0.5 KL(T=3).
exp_name: E1k_yamnet_kd
model: yamnet_ft
mode: generalist
teacher: checkpoints/E0_efficientat_generalist/best.pt
kd: {alpha: 0.5, T: 3.0}
epochs: 20
lr: 1.0e-4
weight_decay: 1.0e-4
batch_size: 64
warmup_epochs: 1
label_smoothing: 0.1
amp: true
seed: 42
patience: 6
num_workers: 4
sampler: {balanced: true, cap: 3000}
aug: {mixup_p: 0.3, mixup_alpha: 0.2, gain_db: 6.0, musan: false}
