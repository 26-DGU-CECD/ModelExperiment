# E0 + MUSAN online noise augmentation (data/musan_train, p=0.5, SNR 5-20 dB). Reference point for all later models.
exp_name: E0m_efficientat_generalist_musan
model: efficientat
mode: generalist
epochs: 20
lr: 1.0e-4
weight_decay: 1.0e-4
batch_size: 64
warmup_epochs: 1
label_smoothing: 0.1
amp: true
seed: 42
patience: 6
num_workers: 4
sampler: {balanced: true, cap: 3000}
aug: {mixup_p: 0.3, mixup_alpha: 0.2, gain_db: 6.0, freqm: 48, timem: 192, musan: true, musan_prob: 0.5, musan_snr_range: [5, 20]}
model_args: {pretrained_name: mn10_as, head_type: mlp}
