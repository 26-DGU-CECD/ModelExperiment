exp_name: S3_mnv4_daily
model: mnv4
mode: specialist
group_set: semantic
epochs: 20
lr: 2.0e-5   # fine-tune from E2k_v2 (init_from); 1e-4 destroyed the warm start (best epoch 0)
weight_decay: 1.0e-4
batch_size: 64
warmup_epochs: 0
label_smoothing: 0.1
amp: true
seed: 42
patience: 8
num_workers: 2
sampler: {balanced: true, cap: 3000}
aug: {mixup_p: 0.3, mixup_alpha: 0.2, gain_db: 6.0, freqm: 48, timem: 192, musan: true, musan_prob: 0.5, musan_snr_range: [5, 20]}
init_from: checkpoints/E2k_v2/best.pt
