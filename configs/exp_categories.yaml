# Categories and display names for src/make_report.py. Only results/*/metrics.json is read.
# Rules: v1-label results excluded; naive-recipe specialist fusions included in D with "(naive 레시피)".
categories:
  A: 단일 범용
  B: 이종 범용 앙상블
  C: 동질 범용 앙상블
  D: 이종 스페셜리스트
  E: 동질 스페셜리스트
  F: 기준선 (oracle, best_single)
  G: 캐스케이드

# relative compute = sum of member MACs / EfficientAT(mn10) MACs (0.128 G per 2 s clip); cascades use expected MACs on the test distribution
macs_G:
  efficientat: 0.128
  mn04: 0.037
  dymn10: 0.144
  mnv4: 0.055
  yamnet_ft: 0.141
  yamnet_frozen: 0.141

# exact id -> {name, cat, compute (relative), members (for compute if not given)}
names:
  E0m_v2:                 {name: "EfficientAT 범용 단일", cat: A, compute: 1.0, ref: true}
  G_mn10_seed1:           {name: "EfficientAT 범용 단일 · seed 1", cat: A, compute: 1.0}
  G_mn10_seed2:           {name: "EfficientAT 범용 단일 · seed 2", cat: A, compute: 1.0}
  G_mn04:                 {name: "EfficientAT-small(mn04) 범용 단일", cat: A, compute: 0.29}
  G_dymn10:               {name: "EfficientAT-dynamic(dymn10) 범용 단일", cat: A, compute: 1.13}
  E1k_v2:                 {name: "YAMNet 범용 단일 (KD)", cat: A, compute: 1.10}
  E1_v2:                  {name: "YAMNet 범용 단일 · 동결 임베딩", cat: A, compute: 1.10}
  E2k_v2:                 {name: "MobileNetV4-Small 범용 단일 (KD)", cat: A, compute: 0.43}
