  SB_mnv4_best:           {name: "MobileNetV4-Small 스페셜리스트 · 데이터 기반 배정 단독", cat: D, compute: 0.43, single_specialist: true}
  A2_efficientat_random:  {name: "EfficientAT 스페셜리스트 · 무작위 배정 단독", cat: D, compute: 1.0, single_specialist: true}
  A2_yamnet_random:       {name: "YAMNet 스페셜리스트 · 무작위 배정 단독", cat: D, compute: 1.10, single_specialist: true}
